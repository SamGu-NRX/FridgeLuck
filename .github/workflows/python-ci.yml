name: Python CI

# The recipe pipeline's portable tests and release gates. The iOS suite runs in
# ios-ci.yml (macOS, hosted); these checks are pure Python and run on Linux.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline-tests-and-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # The pipeline suite targets 3.13 (match/case, PEP 604 unions).
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install --quiet pytest jsonschema

      - name: Pipeline and gate unit tests
        run: |
          python -m pytest data/recipes/tools/tests/test_pipeline.py \
            data/recipes/tools/test_gates.py -q

      - name: Corpus release gate
        run: python data/recipes/tools/validate_corpus.py

      - name: World packet checker
        run: python data/recipe-sources/world-2026-10/src/check_packet.py --quiet

      - name: Compiled bundle validation
        run: python data/recipes/tools/validate_bundle.py

      - name: Byte-identity (committed bundle vs fresh compile)
        # On a CI checkout the worktree equals the committed head, so a
        # diff-vs-HEAD after compiling proves the committed build copy is
        # exactly what a fresh compile produces.
        run: |
          python data/recipes/tools/compile_bundle.py
          git diff --exit-code --stat -- data/recipes/build/recipes-v2.json \
            || { echo "::error::committed build copy differs from a fresh compile"; git diff -- data/recipes/build/recipes-v2.json | head -40; exit 1; }
